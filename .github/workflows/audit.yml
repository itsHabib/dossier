name: audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisory ignores: add `ignore: RUSTSEC-YYYY-NNNN` below only with a
      # one-line comment here explaining why (mirrors CLAUDE.md #[allow] posture).
      # Example:
      #   ignore: RUSTSEC-2024-0001  # transitive via X; no fix until upstream bumps Y
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
